<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Redirecting to Birthday Vault... 🎂</title>
  <meta http-equiv="refresh" content="2; url=https://yagnikindus2305.github.io/happy-birthday-happy/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #1a0f2e 0%, #080314 100%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .icon { font-size: 64px; margin-bottom: 16px; animation: bounce 1.5s infinite; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #ffd166;
      margin-bottom: 12px;
    }
    p {
      color: #cbd5e1;
      font-size: 16px;
      margin-bottom: 24px;
      max-width: 400px;
    }
    a {
      display: inline-block;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(255, 0, 127, 0.4);
      transition: transform 0.2s;
    }
    a:active { transform: scale(0.96); }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="icon">🎁✨</div>
  <h1>Heading to Happy's Birthday Vault!</h1>
  <p>Hold tight Cartoon, redirecting you to the celebration vault in a moment...</p>
  <a href="https://yagnikindus2305.github.io/happy-birthday-happy/">Click Here To Open Now 🔓</a>
</body>
</html>
